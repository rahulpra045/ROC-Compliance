name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']          # e.g. git tag v3.1 && git push origin v3.1
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm ROCCompliance.spec
      - name: Make version.json
        shell: bash
        run: python make_version_json.py "$(cat RELEASE_NOTES.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: ROCCompliance-windows
          path: |
            dist/ROCCompliance.exe
            dist/version.json
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/ROCCompliance.exe dist/version.json --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.txt
